default:
  image: python:3.13-slim
  before_script:
    - echo "source=$CI_PIPELINE_SOURCE commit=$CI_COMMIT_SHORT_SHA"

stages:
  - check
  - test

syntax-check:
  stage: check
  script:
    - python -m py_compile test_checkout.py

checkout-test:
  stage: test
  script:
    - python -m pip install pytest==9.2.0 pytest-html==4.2.0
    - python -m pytest -q test_checkout.py::test_total_includes_delivery --html=report.html --self-contained-html
  artifacts:
    when: always
    paths:
      - report.html

free-delivery:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - python -m pip install pytest==9.2.0
    - python -m pytest -q test_checkout.py::test_total_with_free_delivery
